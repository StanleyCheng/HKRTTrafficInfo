name: Vercel deploy

# Trigger after `Verify` succeeds on `main`. workflow_run keeps the deploy
# step out of the critical path so a failing verification fast-fails without
# burning deploy budget.

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy per commit at a time; do not cancel in flight to avoid orphan
# builds left half-uploaded on Vercel.
concurrency:
  group: "vercel-deploy-${{ github.event.workflow_run.head_sha }}"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Deploy to Vercel (production)
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it at https://github.com/${{ github.repository }}/settings/secrets/actions/new with scope 'Production Deployment' on project hkrttrafficinfo."
            exit 1
          fi
          # --yes skips the "deploy to existing project?" confirmation; the
          # project is matched from vercel.json + git remote automatically.
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
