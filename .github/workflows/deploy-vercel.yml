name: Vercel deploy

# Trigger after `Verify` succeeds on `main`. workflow_run keeps the deploy
# step out of the critical path so a failing verification fast-fails without
# burning deploy budget.

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize production promotion across commits. A queued newer revision may
# replace an older pending run; a running upload is allowed to finish.
concurrency:
  group: "vercel-production"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Check revision before publishing
        id: revision
        run: bash scripts/require-current-main.sh "${{ github.event.workflow_run.head_sha }}"
      - name: Deploy to Vercel (production)
        if: ${{ steps.revision.outputs.eligible == 'true' }}
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add a token scoped to the team that owns this project at https://vercel.com/account/tokens (Scope → team → All Projects) using https://github.com/${{ github.repository }}/settings/secrets/actions/new."
            exit 1
          fi
          # --yes skips the "deploy to existing project?" confirmation; the
          # project is matched from vercel.json + git remote automatically.
          if ! npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"; then
            echo "::error::Vercel refused these credentials: the token is revoked or expired, or it is scoped to a single project. The CLI resolves the account before deploying, so a project-scoped token fails here with 'The token provided via --token argument is not valid' even though the REST API accepts it. Create a token at https://vercel.com/account/tokens with Scope set to the team (All Projects)."
            exit 1
          fi
