name: Verify

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "verify-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: npm run verify
      - name: Cloudflare Worker build
        run: npm run build
      - name: Install browser for smoke checks
        run: npx playwright install --with-deps chromium
      - name: Check browser journeys
        run: npm run verify:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: outputs/browser-smoke/
          if-no-files-found: ignore
